<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>

    <style>
        .box {
            border: 2px solid purple;
            padding: 10px;
            margin: 10px;
        }
    </style>
</head>

<body>

    <div class="box">

        <p><b>Order List</b></p>
        <ol>
            <li>Mango</li>
            <li>Banana</li>
            <li>Grapes</li>
            <li>Orange</li>
            <li>Apple</li>
        </ol>

        <ol type="I">
            <li>Mango</li>
            <li>Banana</li>
            <li>Grapes</li>
            <li>Orange</li>
            <li>Apple</li>
        </ol>

    </div>

    <div class="box">

        <p><b>Unorder List</b></p>
        <ul>
            <li>C
                <ol>
                    <li>loops</li>
                    <li>functions</li>
                    <li>datatypes</li>
                </ol>
            </li>
            <li>C++</li>
            <li>Java</li>
            <li>Python</li>
            <li>JavaScript</li>
        </ul>

    </div>


</body>

</html>
